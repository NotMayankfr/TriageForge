[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triageforge"
version = "0.1.0"
description = "Deterministic cloud failure triage lab, automated diagnosis engine, and support case platform."
authors = [{ name = "Mayank", email = "dev@triageforge.local" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "cryptography>=41.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.2.0",
    "boto3>=1.34.0",
]

[project.scripts]
triageforge = "triageforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["triageforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
